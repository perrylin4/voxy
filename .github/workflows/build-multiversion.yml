name: Build Neo Voxy multiversion

on:
  workflow_dispatch:
  push:
    branches: [multiversion]
  pull_request:
    branches: [multiversion]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: neoforge-1.21.1
            label: 1.21.1 NeoForge
            java: '21'
          - edition: client-1.20.1
            label: 1.20.1 Forge client
            java: '17'
          - edition: client-26.1.2
            label: 26.1.2 NeoForge client
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Keep JDK internal-API notices out of annotations
        if: matrix.edition == 'client-26.1.2'
        shell: bash
        run: |
          echo '::remove-matcher owner=javac::'
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/javac-errors.json"

      - name: Build ${{ matrix.edition }}
        env:
          EDITION: ${{ matrix.edition }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh "$EDITION"
          mkdir -p "stage/$EDITION"
          mapfile -t jars < <(find dist -maxdepth 1 -type f -name '*.jar' -print)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one release JAR, found %d:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          mv "${jars[0]}" "stage/$EDITION/"

      - name: Pass release to bundle job
        uses: actions/cache/save@v5
        with:
          path: stage/${{ matrix.edition }}
          key: multiversion-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}

  bundle:
    name: Collect multiversion bundle
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Restore 1.21.1 release
        uses: actions/cache/restore@v5
        with:
          path: stage/neoforge-1.21.1
          key: multiversion-${{ github.run_id }}-${{ github.run_attempt }}-neoforge-1.21.1
          fail-on-cache-miss: true

      - name: Restore 1.20.1 client release
        uses: actions/cache/restore@v5
        with:
          path: stage/client-1.20.1
          key: multiversion-${{ github.run_id }}-${{ github.run_attempt }}-client-1.20.1
          fail-on-cache-miss: true

      - name: Restore 26.1.2 client release
        uses: actions/cache/restore@v5
        with:
          path: stage/client-26.1.2
          key: multiversion-${{ github.run_id }}-${{ github.run_attempt }}-client-26.1.2
          fail-on-cache-miss: true

      - name: Verify release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find stage -type f -name '*.jar' -print | sort)
          if (( ${#jars[@]} != 3 )); then
            printf 'Expected 3 release JARs, found %d:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[@]}" release/
          sha256sum release/*.jar

      - name: Upload multiversion bundle
        uses: actions/upload-artifact@v7
        with:
          name: neo-voxy-multiversion
          path: release/*.jar
          if-no-files-found: error
          compression-level: 0
